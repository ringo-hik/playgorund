<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-container { max-width: 800px; margin: 0 auto; }
        .test-input { width: 100%; height: 200px; margin-bottom: 20px; }
        .test-output { border: 1px solid #ccc; padding: 20px; background: #f9f9f9; }
    </style>
    <link rel="stylesheet" href="./src/aiOps/styles/customMarkdown.css">
    <link rel="stylesheet" href="./src/aiOps/styles/aiChatOps.css">
</head>
<body>
    <div class="test-container">
        <h1>마크다운 렌더링 테스트</h1>
        
        <textarea class="test-input" id="markdownInput">## 간단한 마크다운 테스트

이것은 **굵은 텍스트**입니다.

이것은 *기울임 텍스트*입니다.

이것은 `인라인 코드`입니다.

- 첫 번째 항목
- 두 번째 항목

1. 번호 항목
2. 두 번째 번호

```javascript
const test = 'simple test';
console.log(test);
```

> [!NOTE]
> 간단한 알림 박스 테스트입니다. 여기서 **굵은 텍스트**를 테스트해봅니다.
> 알림 박스 안에서 여러 줄 텍스트 테스트입니다.

일반 문단입니다. 이것은 알림 박스가 아닙니다.

### 추가 테스트

이것은 일반 문단이고 알림 박스와 완전히 분리되어야 합니다.</textarea>
        
        <button onclick="testMarkdown()">테스트 실행</button>
        
        <h2>렌더링 결과:</h2>
        <div class="test-output" id="output"></div>
    </div>

    <script type="module">
        import { convertMarkdownToHtml } from './src/aiOps/service/convertMarkdownToHtml.js';
        
        window.testMarkdown = function() {
            const input = document.getElementById('markdownInput').value;
            const output = document.getElementById('output');
            
            console.log('Input:', input);
            const result = convertMarkdownToHtml(input);
            console.log('Output:', result);
            
            output.innerHTML = result;
        };
        
        // 페이지 로드 시 자동 테스트
        window.addEventListener('load', () => {
            testMarkdown();
        });
    </script>
</body>
</html>
