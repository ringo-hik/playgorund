<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Float Chat Mock</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="FloatChat.css">
    <link rel="stylesheet" href="CustomMarkdown.css">
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f2f5; }
        h1 { color: #333; }
        p { color: #666; }
    </style>
</head>
<body>
    <h1>Float Chat Mockup Page</h1>
    <p>This is a simple page to test the floating chat component.</p>

    <div id="app">
        <float-chat-layout></float-chat-layout>
    </div>

    <!-- Vue and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/http-vue-loader@1.4.2/src/httpVueLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <!-- Unicons with proper initialization -->
    <script src="https://unpkg.com/@iconscout/unicons@4.0.8/dist/unicons.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@iconscout/unicons@4.0.8/css/line.css">
    <script>
        // Globally register the unicon component
        if (typeof Unicon !== 'undefined' && typeof Vue !== 'undefined') {
            Vue.component('unicon', Unicon);
        }
    </script>

    <!-- Load services first -->
    <script type="module" src="floatchatService.js"></script>
    <script type="module" src="llmContext.js"></script>

    <script>
        // Wait for all scripts to load
        document.addEventListener('DOMContentLoaded', function() {
            // Initialize Vue app
            new Vue({
                el: '#app',
                components: {
                    'float-chat-layout': httpVueLoader('FloatChatLayout.vue')
                }
            });
        });
    </script>
</body>
</html>
