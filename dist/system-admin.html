<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시스템 관리자 - AIChatOps</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .loading-container {
      text-align: center;
      padding: 40px;
    }
    
    .loading-text {
      font-size: 18px;
      color: #64748b;
      margin-bottom: 20px;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .redirect-info {
      margin-top: 20px;
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="loading-container">
    <div class="loading-text">시스템 관리 페이지를 준비 중입니다...</div>
    <div class="loading-spinner"></div>
    <div class="redirect-info">
      Vue 앱이 로드되면 자동으로 관리 페이지가 표시됩니다.
    </div>
  </div>

  <script>
    // 개발 환경에서는 메인 앱으로 리다이렉트
    setTimeout(() => {
      const baseUrl = window.location.origin + window.location.pathname.replace('/system-admin.html', '');
      const mainAppUrl = baseUrl + '/#/admin';
      
      // 새 창에서 열기 대신 현재 창에서 Vue 앱 로드 시도
      window.location.href = baseUrl + '/index.html?admin=true';
    }, 2000);
  </script>
</body>
</html>
